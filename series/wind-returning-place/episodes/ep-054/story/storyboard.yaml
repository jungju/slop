pages:
  - panel: 1
    beat: "윤서가 두꺼운 인화 보드를 보관하려 한다"
    caption: "윤서는 말린 해조류를 붙인 두꺼운 인화 보드를 보관장에 세우려 했다."
    prompt: "Restrained Korean webtoon illustration, soft ink linework, simplified visible contours, calm flat painterly color blocks, light cel-shaded faces and hands, gentle paper finish, quiet Seoul/Jeju composition, repeatable drawn character design, no reader-facing text. Jeju community archive workroom. Elementary-school-age Korean girl Kang Yunseo, clear child proportions, short straight jaw-length black bob with blunt bangs, muted sea-blue hooded rain jacket, cream sweatshirt, charcoal pants and dark rubber boots, carries one thick cream mounted board bearing a simple unlettered pressed-seaweed image toward a low cream vertical print rack. No writing, adult-looking child, photorealism, logo, watermark, caption, speech bubble, or panel grid."
