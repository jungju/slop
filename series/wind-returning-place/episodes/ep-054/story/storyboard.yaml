    prompt: "Restrained Korean webtoon illustration, soft ink linework, simplified visible contours, calm flat painterly color blocks, light cel-shaded faces and hands, gentle paper finish, quiet Seoul/Jeju composition, repeatable drawn character design, no reader-facing text. Slim clean-shaven 26-year-old Korean man Han Doyun, slightly long wavy black hair, gray hoodie under dark coat, old brown messenger bag and black-silver vintage film camera, pushes the thick mounted board downward into the visibly narrow cobalt slot while child Yunseo watches. No scanner, text, logo, watermark, bubble, or panel grid."
