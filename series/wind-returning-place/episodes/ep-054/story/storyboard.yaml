    prompt: "Restrained Korean webtoon illustration, soft ink linework, simplified visible contours, calm flat painterly color blocks, light cel-shaded faces and hands, gentle paper finish, quiet Seoul/Jeju composition, repeatable drawn character design, no reader-facing text. Clear close-up: the thick cream board is stuck halfway in the narrow felt slot, with one fine fresh scrape on its lower corner and the felt pinched inward. Yunseo points at the single damage mark. No broken board, writing, logo, watermark, bubble, or panel grid."
