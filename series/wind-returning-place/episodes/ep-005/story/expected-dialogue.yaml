episode_id: ep-005
expected_text:
- id: p01-caption
  panel: 1
  kind: caption
  text: 도윤은 전시할 사진을 고르며, 흐릿한 연락지를 따로 밀어 두었다.
  required: true
- id: p02-caption
  panel: 2
  kind: caption
  text: 좋은 사진은 벽으로 가고, 흔들린 얼굴은 조용히 봉투 속으로 밀렸다.
  required: true
- id: p03-caption
  panel: 3
  kind: caption
  text: 제주 마을 회관 창가에서 윤서가 그 사진을 집어 들었다.
  required: true
- id: p04-caption
  panel: 4
  kind: caption
  text: 윤서는 사진을 들고 물었다. "왜 이건 나쁜 사진이에요?"
  required: true
- id: p05-caption
  panel: 5
  kind: caption
  text: 도윤은 흔들렸다는 말 말고는, 아이에게 줄 말을 찾지 못했다.
  required: true
- id: p06-caption
  panel: 6
  kind: caption
  text: 순덕은 대답을 대신하지 않고, 바람에 뒤집히는 종이만 눌러 주었다.
  required: true
- id: p07-caption
  panel: 7
  kind: caption
  text: 연락지의 작은 칸들은 실패처럼 보였지만, 모두 같은 하루를 지나온 빛이었다.
  required: true
- id: p08-caption
  panel: 8
  kind: caption
  text: 윤서는 작은 카메라를 들고, 잘 찍는 법보다 보고 싶은 곳을 먼저 골랐다.
  required: true
- id: p09-caption
  panel: 9
  kind: caption
  text: 항구의 빛은 고르지 않았고, 아이의 손도 바람을 따라 조금씩 흔들렸다.
  required: true
- id: p10-caption
  panel: 10
  kind: caption
  text: 도윤은 초점을 맞추라고 말하려다, 그 말을 다시 주머니에 넣었다.
  required: true
- id: p11-caption
  panel: 11
  kind: caption
  text: 셔터 소리 사이로, 바다는 선명하지 않은 얼굴들을 잠깐씩 비추었다.
  required: true
- id: p12-caption
  panel: 12
  kind: caption
  text: 화면 속 사진은 기울어 있었지만, 그 안의 웃음은 지워지지 않았다.
  required: true
- id: p13-caption
  panel: 13
  kind: caption
  text: 도윤은 봉투 속에 남겨 둔 사진을 다시 꺼내, 손바닥 위에 올려 보았다.
  required: true
- id: p14-caption
  panel: 14
  kind: caption
  text: 서울의 벽 앞에서 그는 제목 없는 카드 하나를 오래 들고 있었다.
  required: true
- id: p15-caption
  panel: 15
  kind: caption
  text: 그는 흐릿한 프레임을 지우지 않고, 고른 사진들 사이에 조용히 걸었다.
  required: true
- id: p16-caption
  panel: 16
  kind: caption
  text: 누군가는 그 사진 앞에서 오래 멈췄고, 아무 설명도 먼저 찾지 않았다.
  required: true
- id: p17-caption
  panel: 17
  kind: caption
  text: 윤서가 남긴 사진도 한쪽에 놓였다. 빛은 조금 삐뚤었고, 그래서 살아 있었다.
  required: true
- id: p18-caption
  panel: 18
  kind: caption
  text: 빈 카드는 빈 채로 남았다. 모르는 마음을 모른다고 두기 위해서였다.
  required: true
- id: p19-caption
  panel: 19
  kind: caption
  text: 전시장 불이 낮아질 때, 도윤은 버린 줄 알았던 빛이 돌아오는 것을 보았다.
  required: true
- id: p20-caption
  panel: 20
  kind: caption
  text: 고르지 않은 빛도, 누군가에게는 돌아갈 길이 되었다.
  required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
