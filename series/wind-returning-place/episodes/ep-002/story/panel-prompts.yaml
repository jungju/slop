global_style: "Korean webtoon-style digital painting, soft ink line, subtle watercolor texture, quiet emotional drama, Seoul gallery whites and grays contrasted with autumn Jeju tangerine orange, sea blue-green, and volcanic black, no text, no speech bubbles, no logos, no watermarks."
character_lock: "Doyun is a slim 26-year-old Korean man with slightly long black wavy hair, gray hoodie under a dark coat, old messenger bag, black-and-silver vintage film camera. Yunseo is a 24-year-old Korean woman with a short black bob, beige knit, green jacket, small travel bag, calm but guarded eyes. Soondeok is an elderly Jeju haenyeo woman with short gray hair and sea-colored windbreaker."
negative_constraints:
  - "Do not include readable text, letters, symbols, logos, signs, speech bubbles, caption boxes, or watermarks."
  - "Do not make the father physically present in current-day scenes except as a photo/memory."
  - "Do not make Doyun solve Yunseo's choice for her."
