pages:
  - { panel: 1, beat: "Doyun pre-sorts visitor prints into equal tray compartments in Seoul", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "서울 작업실에서, 도윤은 방문객의 인화지를 같은 크기의 칸에 미리 나눠 두었다." }
  - { panel: 2, beat: "The visitor finds a long print bent in a narrow compartment", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "돌아온 사람은 긴 사진 한 장이 좁은 칸에 눌려 휘어진 것을 발견했다." }
  - { panel: 3, beat: "Doyun sees that neat compartments decided another person's sequence", continuity_refs: [], caption: "가지런한 칸이, 사진보다 먼저 다른 사람의 순서를 정하고 있었다." }
  - { panel: 4, beat: "Yunseo spreads small sea and stone-wall photographs in the Jeju tray", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "제주 작업방에서 윤서는 바다와 돌담을 찍은 작은 사진들을 쟁반에 펼쳤다." }
  - { panel: 5, beat: "Three equal compartments cannot hold Yunseo's longer middle sequence", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "같은 넓이의 세 칸에는 윤서가 고른 긴 가운데 순서가 들어가지 않았다." }
  - { panel: 6, beat: "Doyun starts filling the empty compartments by print size", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "도윤은 사진 크기에 맞춰 한 장씩 빈칸을 채우려 했다." }
  - { panel: 7, beat: "Yunseo pulls the tray toward herself and protects her longer middle story", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "윤서는 쟁반을 자기 쪽으로 당기고, 가운데 이야기가 더 길다고 알렸다." }
  - { panel: 8, beat: "Soondeok removes one blue divider and points attention back to the photographs", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "순덕은 푸른 칸막이 하나를 빼서 옆에 놓고, 사진부터 보라고 했다." }
  - { panel: 9, beat: "Doyun removes the remaining dividers and lays them loose beside the tray", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "도윤은 남은 칸막이도 뽑아 쟁반 옆에 느슨하게 내려놓았다." }
  - { panel: 10, beat: "Yunseo studies the empty grooves and two blue dividers", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "윤서는 빈 홈과 두 개의 푸른 칸막이를 차례로 살폈다." }
  - { panel: 11, beat: "Yunseo slots the first divider after two sea photographs", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "바다 사진 두 장 뒤에, 첫 칸막이가 곧게 꽂혔다." }
  - { panel: 12, beat: "She places the second divider farther right to widen the middle compartment", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "두 번째 칸막이는 더 오른쪽으로 가서 가운데 칸을 넓혔다." }
  - { panel: 13, beat: "Three linked photographs rest unbent in the wide middle compartment", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "넓어진 칸에는 세로 사진과 이어지는 두 장이 눌리지 않고 놓였다." }
  - { panel: 14, beat: "One small cream-backed stone-wall print enters the narrow last compartment", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "마지막 좁은 칸에는 크림색 뒷면의 작은 돌담 사진이 들어갔다." }
  - { panel: 15, beat: "Yunseo tests one adjacent groove, sees a print press, and restores the divider", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "윤서는 첫 칸막이를 한 홈 옮겨 보고, 사진이 눌리자 다시 돌려놓았다." }
  - { panel: 16, beat: "Yunseo's two-wide-three-one sequence is complete in her chosen compartments", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "두 장, 넓은 세 장, 한 장의 순서가 윤서가 만든 칸 안에 완성됐다." }
  - { panel: 17, beat: "Doyun leaves a tray and unseated dividers on a Seoul shared table", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "서울에 돌아온 도윤은 칸막이를 꽂지 않은 채 쟁반 곁에 두었다." }
  - { panel: 18, beat: "An adult visitor makes one wide compartment for a panoramic photo strip", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "한 방문객은 긴 사진 띠에 맞춰 넓은 칸 하나를 만들었다." }
  - { panel: 19, beat: "A later visitor repositions the dividers for small prints", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "다음 방문객은 작은 인화지에 맞춰 칸막이를 다시 옮겼다." }
  - { panel: 20, beat: "Doyun photographs a hand moving a divider rather than fixed categories", continuity_refs: [{ id: prop.removable-divider-sorting-tray.001, version: 1 }], caption: "칸은 사진을 나누기보다, 고르는 손을 따라 옮겨졌다." }
