episode_intent: "A circulating harbor tray teaches Doyun that care can stay useful by moving through ordinary hands instead of being preserved as an exhibit object."
emotional_arc:
  start: "Doyun wants to take a scratched serving tray out of use and frame it as proof of the harbor's care."
  turn: "Soondeok makes him carry it through lunch service, and Yunseo chooses for herself how to return it after eating."
  end: "Doyun gives the Seoul gallery a plainly useful return tray and records the completed loop without naming an owner."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul question, busy Jeju harbor meal, quiet Seoul return"
character_agency:
  protagonist: "Doyun chooses to return the tray to work and builds an unclaimed return tray in Seoul."
  supporting_characters: "Soondeok rejects preservation over use; Yunseo decides to carry her own emptied bowl back instead of waiting for an adult."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows a gallery visitor placing a finished cup onto the plain blue return tray while Doyun leaves it in the shared tea corner."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flatter painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
