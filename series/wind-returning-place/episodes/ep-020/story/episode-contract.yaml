episode_intent: "A stubborn high workshop door handle teaches Doyun to change shared access at the point of use instead of expecting the smallest person to keep asking for help."
emotional_arc:
  start: "Doyun treats a high brass handle as an ordinary fixed detail while Yunseo repeatedly waits for an adult."
  turn: "Yunseo measures her reach and proposes the lower mounting point; Soondeok insists the repair must work with wet hands and carried loads."
  end: "Doyun installs a lower matching handle in Seoul and watches a child enter independently while he keeps working."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul observation, active Jeju measurement and repair, quiet Seoul access payoff"
character_agency:
  protagonist: "Doyun listens, measures, drills, and tests without presenting the idea as his own."
  supporting_characters: "Yunseo identifies and marks the reachable height; Soondeok adds the wet-hand and carrying constraint."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows a child opening the Seoul workroom door without help."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flat painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
