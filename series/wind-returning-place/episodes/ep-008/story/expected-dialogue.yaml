episode_id: ep-008
expected_text:
  - id: p01-caption
    panel: 1
    kind: caption
    text: 서울 갤러리 문턱에서, 도윤은 접힌 배표 한 장을 오래 쥐고 있었다.
    required: true
  - id: p02-caption
    panel: 2
    kind: caption
    text: 버리려던 표는 카메라 옆에 놓이자, 작은 길처럼 다시 보였다.
    required: true
  - id: p03-caption
    panel: 3
    kind: caption
    text: 순덕은 표가 말해 주는 건 움직였다는 사실뿐이라고 했다.
    required: true
  - id: p04-caption
    panel: 4
    kind: caption
    text: 윤서는 접힌 모서리를 펴 보며 물었다. "다 쓴 표는 왜 접어요?"
    required: true
  - id: p05-caption
    panel: 5
    kind: caption
    text: 도윤은 대답 대신, 사진보다 먼저 항구로 난 길을 따라 걸었다.
    required: true
  - id: p06-caption
    panel: 6
    kind: caption
    text: 사람들은 각자의 가방과 말하지 않은 이유를 들고 배를 기다렸다.
    required: true
  - id: p07-caption
    panel: 7
    kind: caption
    text: 바람이 표 한 귀퉁이를 찢자, 도윤은 그 조각까지 주머니에 넣었다.
    required: true
  - id: p08-caption
    panel: 8
    kind: caption
    text: 윤서는 빈 종이를 접어 작은 길을 만들고, 다시 조심히 펼쳤다.
    required: true
  - id: p09-caption
    panel: 9
    kind: caption
    text: 순덕은 앞서 걸으며, 돌아오는 길도 남이 대신 정해 주지 않는다고 했다.
    required: true
  - id: p10-caption
    panel: 10
    kind: caption
    text: 도윤은 얼굴 대신, 표를 쥔 손들의 망설임을 조용히 찍었다.
    required: true
  - id: p11-caption
    panel: 11
    kind: caption
    text: 배는 큰 작별 없이 떠났고, 항구에는 흔들린 줄과 젖은 빛만 남았다.
    required: true
  - id: p12-caption
    panel: 12
    kind: caption
    text: 도윤은 타지 않은 배도, 어떤 날에는 선택이 될 수 있음을 알았다.
    required: true
  - id: p13-caption
    panel: 13
    kind: caption
    text: 서울로 돌아온 표에는 여전히 접힌 자국이 또렷하게 남아 있었다.
    required: true
  - id: p14-caption
    panel: 14
    kind: caption
    text: 그는 전시 벽보다 먼저, 사람들이 드나드는 문턱을 오래 바라보았다.
    required: true
  - id: p15-caption
    panel: 15
    kind: caption
    text: 관람객들은 사진 사이보다, 문을 지나가는 자기 걸음을 더 천천히 느꼈다.
    required: true
  - id: p16-caption
    panel: 16
    kind: caption
    text: 윤서가 접어 보낸 종이길은 낮은 문가에 작게 놓였다.
    required: true
  - id: p17-caption
    panel: 17
    kind: caption
    text: 도윤은 배표를 펼쳤지만, 접힌 선을 억지로 누르지 않았다.
    required: true
  - id: p18-caption
    panel: 18
    kind: caption
    text: 한 관람객은 그 선 앞에서 잠시 멈췄다가, 다시 뒤를 돌아보았다.
    required: true
  - id: p19-caption
    panel: 19
    kind: caption
    text: 문을 닫은 뒤, 도윤은 벽이 아니라 문턱에 서서 바람을 들었다.
    required: true
  - id: p20-caption
    panel: 20
    kind: caption
    text: 접힌 표는, 돌아온 길도 자국을 품은 채 앞으로 열릴 수 있다고 말했다.
    required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
