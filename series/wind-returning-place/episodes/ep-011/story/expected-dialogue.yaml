episode_id: ep-011
expected_text:
  - id: p01-caption
    panel: 1
    kind: caption
    text: 서울 갤러리의 회색 아침, 도윤은 사진 상자 사이에서 소금이 굳은 손수건을 발견했다.
    required: true
  - id: p02-caption
    panel: 2
    kind: caption
    text: 그는 먼지를 털어 내려다, 접힌 천 끝에 남은 흰 자국을 먼저 보았다.
    required: true
  - id: p03-caption
    panel: 3
    kind: caption
    text: 창가에 손수건을 흔들어도, 소금빛 선은 쉽게 사라지지 않았다.
    required: true
  - id: p04-caption
    panel: 4
    kind: caption
    text: 제주의 항구 골목은 빨래줄마다 바람을 조금씩 붙잡아 두고 있었다.
    required: true
  - id: p05-caption
    panel: 5
    kind: caption
    text: 순덕은 천을 비틀어 짜며, 다 지워야만 깨끗한 건 아니라고 말했다.
    required: true
  - id: p06-caption
    panel: 6
    kind: caption
    text: 윤서는 손수건을 들고 물었다. "깨끗하면 아무 일도 없던 거예요?"
    required: true
  - id: p07-caption
    panel: 7
    kind: caption
    text: 순덕은 젖은 천을 줄에 걸고, 남는 자국도 가끔은 몸이 기억한 길이라고 했다.
    required: true
  - id: p08-caption
    panel: 8
    kind: caption
    text: 항구의 일꾼은 바닷물을 닦은 천을 말없이 널어 두고 다시 걸어갔다.
    required: true
  - id: p09-caption
    panel: 9
    kind: caption
    text: 마른 뒤에도 손수건 가장자리에는 희미한 소금 선이 남아 있었다.
    required: true
  - id: p10-caption
    panel: 10
    kind: caption
    text: 도윤은 그 선을 없애는 대신, 바람에 흔들리는 그림자까지 함께 찍었다.
    required: true
  - id: p11-caption
    panel: 11
    kind: caption
    text: 윤서는 작은 집게를 꽂으며, 남길 자리를 스스로 골랐다.
    required: true
  - id: p12-caption
    panel: 12
    kind: caption
    text: 도윤은 카메라를 내리고, 사라지지 않은 자국이 조용히 마르는 시간을 보았다.
    required: true
  - id: p13-caption
    panel: 13
    kind: caption
    text: 서울로 돌아온 그는 사진 옆에 얇은 천 스크린을 조심스럽게 걸었다.
    required: true
  - id: p14-caption
    panel: 14
    kind: caption
    text: 관람객들은 설명보다 먼저, 천 뒤에서 흔들리는 제주 빛을 보았다.
    required: true
  - id: p15-caption
    panel: 15
    kind: caption
    text: 윤서가 고른 작은 집게는 아이 눈높이 선반에 따로 놓였다.
    required: true
  - id: p16-caption
    panel: 16
    kind: caption
    text: 누군가는 주머니 속 손수건을 만지며, 지우지 못한 하루를 떠올렸다.
    required: true
  - id: p17-caption
    panel: 17
    kind: caption
    text: 낮은 선반 앞에서 아이는 어른들보다 먼저 소금빛 사진을 올려다보았다.
    required: true
  - id: p18-caption
    panel: 18
    kind: caption
    text: 문을 닫은 뒤에도 천의 그림자는 서울 바닥에 바람의 결을 남겼다.
    required: true
  - id: p19-caption
    panel: 19
    kind: caption
    text: 도윤은 손수건을 느슨하게 접어, 흰 선이 밖으로 보이게 두었다.
    required: true
  - id: p20-caption
    panel: 20
    kind: caption
    text: 소금빛 손수건은, 지워지지 않은 자국도 누군가를 다시 마르게 하는 바람이라고 말했다.
    required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
