episode: ep-012
title: "바람이 돌아오는 곳 12: 돌담의 빈틈"
lettering_mode: local_template3_narration_cards
expected_text:
  - { page: 1, text: "서울 작업대의 현무암 조각은, 맞을 곳을 찾지 못한 채 손바닥에 남아 있었다." }
  - { page: 2, text: "도윤은 비어 있는 자리를 보면, 자꾸 무언가를 끼워 넣고 싶어졌다." }
  - { page: 3, text: "순덕은 전화로, 돌담은 사진보다 바람을 먼저 생각한다며 제주로 오라 했다." }
  - { page: 4, text: "제주 아침의 낮은 돌담에는 손바닥만 한 틈이 하나 있었다." }
  - { page: 5, text: "바람은 그 틈에서 멈추지 않고, 반대편 풀을 조금 흔들었다." }
  - { page: 6, text: "도윤은 주운 돌을 들고, 금방이라도 그 자리를 막을 듯 서 있었다." }
  - { page: 7, text: "순덕은 돌보다 먼저, 그 틈으로 무엇이 지나는지 보라고 했다." }
  - { page: 8, text: "틈 사이에는 마른 풀잎 하나와 멀리 바다의 옅은 빛이 함께 보였다." }
  - { page: 9, text: "윤서는 작은 돌을 들고 물었다. \"꼭 막아야 해요?\"" }
  - { page: 10, text: "도윤은 대답 대신 카메라의 초점을 그 작은 어둠에 맞췄다." }
  - { page: 11, text: "순덕은 사람이 다니는 길은 고치되, 바람 길까지 막지는 않는다고 말했다." }
  - { page: 12, text: "이웃은 낮은 담 곁을 지나며, 오늘도 바람이 세다 하고 웃었다." }
  - { page: 13, text: "도윤은 돌을 옆에 내려두고, 빈틈의 빛이 움직이는 순간을 찍었다." }
  - { page: 14, text: "윤서는 조약돌을 틈 앞에 두었다가, 바람이 안 보인다며 다시 치웠다." }
  - { page: 15, text: "서울로 돌아온 도윤은 사진들 아래에 낮은 돌 선을 조용히 놓았다." }
  - { page: 16, text: "돌 선 한가운데에는, 손바닥만 한 자리를 끝내 비워 두었다." }
  - { page: 17, text: "관람객들은 완성된 벽보다, 그 빈칸 너머의 제주 빛 앞에서 오래 멈췄다." }
  - { page: 18, text: "윤서가 보낸 작은 조약돌 사진은 아이 눈높이 선반에 기대어 있었다." }
  - { page: 19, text: "문을 닫은 뒤, 도윤은 전시장 문틈으로 들어오는 바람을 가만히 들었다." }
  - { page: 20, text: "돌담의 빈틈은, 막히지 않은 길도 오래 남을 수 있다고 말했다." }
