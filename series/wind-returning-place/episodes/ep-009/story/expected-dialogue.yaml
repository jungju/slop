episode_id: ep-009
expected_text:
  - id: p01-caption
    panel: 1
    kind: caption
    text: 서울 갤러리 창가에 놓인 작은 화분은, 잎보다 먼저 마른 흙을 보여 주었다.
    required: true
  - id: p02-caption
    panel: 2
    kind: caption
    text: 도윤은 버려진 화분을 치우려다, 유리 안쪽에 남은 물자국을 오래 보았다.
    required: true
  - id: p03-caption
    panel: 3
    kind: caption
    text: 순덕은 전화로, 겨울에도 온실은 쉬는 게 아니라 천천히 숨 쉰다고 했다.
    required: true
  - id: p04-caption
    panel: 4
    kind: caption
    text: 제주 온실 문 앞에서, 도윤의 카메라는 차가운 유리에 먼저 김을 만들었다.
    required: true
  - id: p05-caption
    panel: 5
    kind: caption
    text: 안에는 큰 꽃보다, 아직 이름표가 붙지 않은 작은 새순들이 낮게 자라고 있었다.
    required: true
  - id: p06-caption
    panel: 6
    kind: caption
    text: 윤서는 입김으로 흐려진 유리에 손가락 하나로 동그라미를 그렸다.
    required: true
  - id: p07-caption
    panel: 7
    kind: caption
    text: "\"밖에서는 안 보이는데, 안에서는 자라고 있는 거예요?\""
    required: true
  - id: p08-caption
    panel: 8
    kind: caption
    text: 도윤은 대답을 찾는 대신, 유리 너머 흐린 빛과 작은 잎을 함께 찍었다.
    required: true
  - id: p09-caption
    panel: 9
    kind: caption
    text: 순덕은 물을 너무 많이 주면 뿌리가 숨을 못 쉰다며, 물뿌리개를 내려놓았다.
    required: true
  - id: p10-caption
    panel: 10
    kind: caption
    text: 기다림도 손을 떼는 일이 될 수 있다는 말을, 도윤은 처음으로 믿어 보았다.
    required: true
  - id: p11-caption
    panel: 11
    kind: caption
    text: 바깥 바람은 세게 불었지만, 온실 안의 잎은 아주 조금씩 방향을 바꾸었다.
    required: true
  - id: p12-caption
    panel: 12
    kind: caption
    text: 윤서는 종이컵에 작은 흙을 담고, 아직 보이지 않는 씨앗을 조심히 덮었다.
    required: true
  - id: p13-caption
    panel: 13
    kind: caption
    text: 서울로 돌아온 도윤은 갤러리 한쪽 창을 닦지 않고 그대로 두었다.
    required: true
  - id: p14-caption
    panel: 14
    kind: caption
    text: 관람객들은 선명한 사진보다, 물자국 너머의 흐린 초록 앞에서 오래 멈췄다.
    required: true
  - id: p15-caption
    panel: 15
    kind: caption
    text: 도윤은 사진 아래에 설명 대신, 빈 물뿌리개 하나를 조용히 놓았다.
    required: true
  - id: p16-caption
    panel: 16
    kind: caption
    text: 윤서가 보낸 작은 종이컵 사진은 전시장 낮은 선반에 따로 기대었다.
    required: true
  - id: p17-caption
    panel: 17
    kind: caption
    text: 누군가는 그 앞에서, 아직 보이지 않는 일을 기다리는 자기 시간을 떠올렸다.
    required: true
  - id: p18-caption
    panel: 18
    kind: caption
    text: 밤이 되자 창의 물자국은 서울 불빛을 작게 흔들어, 온실의 숨처럼 보였다.
    required: true
  - id: p19-caption
    panel: 19
    kind: caption
    text: 도윤은 카메라를 내려놓고, 마른 화분에 물을 한 번만 천천히 주었다.
    required: true
  - id: p20-caption
    panel: 20
    kind: caption
    text: 겨울 온실은, 보이지 않는 자람도 돌아올 시간을 품고 있다고 말했다.
    required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
