  - { panel: 10, beat: "She asks what interval helps", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "순덕은 시간을 맞추지 말고, 필요한 시간을 먼저 물으라고 했다." }
  - { panel: 11, beat: "Doyun marks a shorter level", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "도윤은 유리 옆에 한 분 높이를 작은 황동 고리로 표시했다." }
  - { panel: 12, beat: "Yunseo rehearses the steps untimed", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "윤서는 모래를 세우지 않은 채 집게와 통의 순서를 한 번 익혔다." }
  - { panel: 13, beat: "She places the timer within reach", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "준비를 마친 윤서는 모래시계를 자기 손 가까이에 놓았다." }
  - { panel: 14, beat: "Yunseo chooses the one-minute mark", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "윤서는 세 분 대신 황동 고리가 있는 한 분을 골랐다." }
