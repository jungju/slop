  - { panel: 16, beat: "The photo paper rinses flat", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "모래가 고리에 닿았을 때, 사진 종이는 구김 없이 물 위에 펴져 있었다." }
  - { panel: 17, beat: "Doyun builds a shared drying station in Seoul", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "서울로 돌아온 도윤은 인화물 건조대 옆에 작은 자리를 비워 두었다." }
  - { panel: 18, beat: "He leaves the timer lying sideways", continuity_refs: [{ id: prop.reversible-sand-timer.001, version: 1 }], caption: "그 자리의 모래시계는 흐르지 않도록 옆으로 누워 있었다." }
