episode_intent: "A working Jeju windbreak mesh teaches Doyun that care can filter harshness without turning air, memory, or a useful object into something owned."
emotional_arc:
  start: "Doyun wants to preserve the frayed green mesh as a photographic object."
  turn: "Soondeok and Yunseo show him that the mesh works because wind, light, and people still pass through it."
  end: "Doyun builds a useful small wind filter in his Seoul workroom and leaves it open for others to use."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul discovery, active Jeju garden repair, quiet Seoul shared-use payoff"
character_agency:
  protagonist: "Doyun chooses to return the working net and make a separate useful screen rather than exhibit the original."
  supporting_characters: "Soondeok redirects preservation toward maintenance; Yunseo chooses a child-height tie position that keeps seedlings visible."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows the small green mesh filtering an open Seoul window while another person can use the worktable without asking Doyun's permission."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flatter painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
