episode_id: ep-006
expected_text:
- id: p01-caption
  panel: 1
  kind: caption
  text: 서울 갤러리 창고에서 도윤은 작은 카세트 상자 하나를 발견했다.
  required: true
- id: p02-caption
  panel: 2
  kind: caption
  text: 그는 사진을 들 때처럼, 이름 없는 테이프를 빛에 비춰 보았다.
  required: true
- id: p03-caption
  panel: 3
  kind: caption
  text: 재생 버튼을 누르자 목소리보다 먼저 바람과 물소리가 밀려왔다.
  required: true
- id: p04-caption
  panel: 4
  kind: caption
  text: 도윤은 답을 캐묻는 대신, 소리가 온 곳을 조심스레 물었다.
  required: true
- id: p05-caption
  panel: 5
  kind: caption
  text: 제주의 길은 이번에도 바람을 먼저 보내 그를 맞았다.
  required: true
- id: p06-caption
  panel: 6
  kind: caption
  text: 순덕은 테이프를 보더니, 오래된 마을의 소리라고만 말했다.
  required: true
- id: p07-caption
  panel: 7
  kind: caption
  text: 윤서는 녹음기를 만지며 물었다. "바람도 목소리예요?"
  required: true
- id: p08-caption
  panel: 8
  kind: caption
  text: 세 사람은 테이프 속 잡음이 닮은 항구 쪽으로 천천히 걸었다.
  required: true
- id: p09-caption
  panel: 9
  kind: caption
  text: 밧줄과 물살과 젖은 돌이, 테이프 속 소리와 비슷하게 흔들렸다.
  required: true
- id: p10-caption
  panel: 10
  kind: caption
  text: 순덕은 그 소리를 설명하지 않고, 손으로 난간의 결만 짚었다.
  required: true
- id: p11-caption
  panel: 11
  kind: caption
  text: 윤서는 작은 돌을 귀에 대고, 들리지 않는 대답을 오래 들었다.
  required: true
- id: p12-caption
  panel: 12
  kind: caption
  text: 도윤은 잡음을 지우면 사라질 마음도 있다는 것을 처음 알았다.
  required: true
- id: p13-caption
  panel: 13
  kind: caption
  text: 서울로 돌아온 그는 사진 옆에 작은 듣는 자리를 만들었다.
  required: true
- id: p14-caption
  panel: 14
  kind: caption
  text: 벽에는 긴 설명 대신, 잠시 머물 수 있는 헤드폰 하나를 걸었다.
  required: true
- id: p15-caption
  panel: 15
  kind: caption
  text: 누군가는 그 앞에 앉아, 사진보다 오래 바람 소리를 들었다.
  required: true
- id: p16-caption
  panel: 16
  kind: caption
  text: 윤서는 제주에서 가져온 작은 돌을 헤드폰 옆에 조용히 놓았다.
  required: true
- id: p17-caption
  panel: 17
  kind: caption
  text: 도윤은 편집기의 손잡이를 돌리다 말고, 남겨 둘 소리를 골랐다.
  required: true
- id: p18-caption
  panel: 18
  kind: caption
  text: 사람들은 각자의 침묵을 들고, 헤드폰을 천천히 내려놓았다.
  required: true
- id: p19-caption
  panel: 19
  kind: caption
  text: 빈 갤러리에서 도윤은 지우지 않은 바람을 다시 들었다.
  required: true
- id: p20-caption
  panel: 20
  kind: caption
  text: 잡음으로 남은 바람도, 누군가에게는 돌아오는 목소리였다.
  required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
