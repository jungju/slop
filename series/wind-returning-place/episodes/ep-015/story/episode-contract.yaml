episode_intent: "An ordinary empty chair teaches Doyun that leaving room is a practical invitation, not a promise that someone must return."
emotional_arc:
  start: "Doyun treats the unclaimed chair as a gap that should be filled or removed."
  turn: "A waiting neighbor uses it briefly, then leaves it for the next tired person."
  end: "Doyun makes a clearly usable but unassigned chair in Seoul and resists turning it into a memorial."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul question, windy Jeju practical test, quiet Seoul payoff"
character_agency:
  protagonist: "Doyun chooses to leave the chair available and records the practice without claiming its story."
  supporting_characters: "Soondeok refuses Doyun's impulse to reserve the chair; Yunseo decides for herself to give up the seat after resting."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows a tired visitor using the unassigned Seoul chair while Doyun keeps the nearby signboard blank."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flatter painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
