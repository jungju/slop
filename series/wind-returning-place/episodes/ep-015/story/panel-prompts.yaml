character_lock: "Doyun is slim, 26, slightly long wavy black hair, gray hoodie under dark navy coat, messenger bag, black-and-silver vintage camera. Soondeok has short gray hair and sea-blue practical work coat. Yunseo is a child with short black bob and yellow-gray rain jacket."
pages:
