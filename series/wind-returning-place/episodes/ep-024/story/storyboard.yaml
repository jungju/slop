  - { panel: 1, beat: "Doyun cleans a dry saucer in Seoul", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "서울 작업실 창가에서, 도윤은 화분 밑의 마른 받침을 닦아 냈다." }
  - { panel: 2, beat: "A blue water line remains", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "가장자리의 푸른 선은 물이 머물던 높이를 보여 주고 있었다." }
  - { panel: 3, beat: "He carries it to Jeju", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "도윤은 받침을 천에 싸서 제주 온실 작업대로 가져갔다." }
  - { panel: 4, beat: "Yunseo waters a camellia seedling", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "윤서는 작은 동백 묘목에 물을 주고 화분을 받침 위에 놓았다." }
  - { panel: 5, beat: "Doyun tries to empty retained water", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "도윤은 고인 물을 보자마자 받침을 들어 비우려 했다." }
  - { panel: 6, beat: "Yunseo stops his hand", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "윤서는 아직 뿌리가 물을 올리는 중이라며 그의 손을 막았다." }
  - { panel: 7, beat: "Dry soil absorbs from below", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "마른 흙 가장자리는 물을 천천히 다시 끌어올리고 있었다." }
  - { panel: 8, beat: "Yunseo chooses the blue threshold", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "윤서는 푸른 선 아래까지는 물을 남겨 두겠다고 정했다." }
  - { panel: 9, beat: "Soondeok distinguishes waiting from rot", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "순덕은 기다리는 물과 썩게 두는 물은 다르다고 말했다." }
  - { panel: 10, beat: "Soondeok checks soil moisture", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "그리고 손가락으로 흙의 촉촉함을 먼저 확인해 보였다." }
  - { panel: 11, beat: "Doyun clears a drain notch", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "도윤은 받침 안쪽에 낮은 배수 홈 하나를 더 닦아 열었다." }
  - { panel: 12, beat: "Yunseo rotates the pot", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "윤서는 화분을 돌려 뿌리 쪽이 고르게 젖도록 자리를 맞췄다." }
  - { panel: 13, beat: "Yunseo checks leaves and soil", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "물이 푸른 선 아래로 내려가자 윤서는 잎과 흙을 다시 살폈다." }
  - { panel: 14, beat: "Yunseo decides absorption is enough", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "윤서는 이제 충분하다며 두 손으로 받침을 꺼냈다." }
  - { panel: 15, beat: "She returns the remaining water", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "남은 물은 윤서가 직접 온실의 물통에 돌려 부었다." }
  - { panel: 16, beat: "A shallow water mark remains", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "받침에는 뿌리가 가져간 만큼의 얕은 물자국만 남았다." }
  - { panel: 17, beat: "Doyun avoids one rule in Seoul", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "서울로 돌아온 도윤은 창가 화분마다 같은 받침을 놓지 않았다." }
  - { panel: 18, beat: "He marks plant-specific thresholds", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "대신 식물마다 물을 남길 높이를 작은 푸른 점으로 표시했다." }
  - { panel: 19, beat: "A visitor checks and empties", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "한 방문객은 자기 화분의 흙을 만져 본 뒤 받침을 비웠다." }
  - { panel: 20, beat: "Doyun observes what should remain", continuity_refs: [{ id: prop.ceramic-plant-saucer.001, version: 1 }], caption: "도윤은 깨끗함보다 먼저, 무엇이 아직 머물러야 하는지 바라보았다." }
