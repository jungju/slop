  - { panel: 1, beat: "Doyun clears the wooden chair for display in Seoul", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }], caption: "서울 작업실에서, 도윤은 낡은 나무 의자를 전시용으로 비웠다." }
  - { panel: 2, beat: "He blocks the cleaned chair with his camera bag", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }], caption: "좌면의 손때를 닦고, 아무도 앉지 않도록 카메라 가방으로 길을 막았다." }
  - { panel: 3, beat: "He brings the chair into a Jeju workroom intending to preserve the wood", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }], caption: "제주에서도 의자를 쓰게 하면서, 나무 표면은 그대로 남겨 두고 싶었다." }
  - { panel: 4, beat: "Yunseo sits on the blue cover after removing a wet raincoat", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "윤서는 젖은 우비를 벗고 푸른 덮개 위에 앉았다." }
  - { panel: 5, beat: "The cover becomes soaked and clings to the chair", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "비에 젖은 천이 나무 좌면에 납작하게 붙었다." }
  - { panel: 6, beat: "Doyun tries to close the chair until the cover dries", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "도윤은 덮개가 마를 때까지 의자를 다시 비우려 했다." }
  - { panel: 7, beat: "Soondeok challenges the display-only response", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "순덕은 젖을 때마다 못 앉게 하면, 덮개가 무슨 소용이냐고 물었다." }
  - { panel: 8, beat: "Yunseo unties the wet cover herself", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "윤서는 뒤로 돌아가 크림색 끈을 하나씩 풀었다." }
  - { panel: 9, beat: "Soondeok rinses and spreads the cover in a basket", continuity_refs: [{ id: prop.replaceable-chair-cover.001, version: 1 }], caption: "순덕은 젖은 덮개를 헹군 뒤, 물이 빠지게 바구니에 넓게 펼쳐 놓았다." }
  - { panel: 10, beat: "Doyun wipes the now bare chair", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }], caption: "도윤은 빈 좌면을 닦았고, 의자는 곧 다시 쓸 수 있었다." }
  - { panel: 11, beat: "A dry spare with the crescent patch waits on a low shelf", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "낮은 선반에는 초승달 패치가 달린 마른 덮개가 하나 더 있었다." }
  - { panel: 12, beat: "Yunseo stops Doyun from tying it for her", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "도윤이 끈을 잡자, 윤서는 자기가 할 수 있다며 의자 뒤로 갔다." }
  - { panel: 13, beat: "Yunseo ties the two cream straps", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "윤서는 두 끈을 짧게 잡아당겨, 자신의 매듭으로 묶었다." }
  - { panel: 14, beat: "She tests the cover and keeps both feet on the floor", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "덮개는 밀리지 않았고, 윤서의 두 발은 그대로 바닥에 닿았다." }
  - { panel: 15, beat: "Wet and dry covers receive separate reachable places", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "젖은 덮개는 바람 통하는 걸이에, 마른 여분은 손이 닿는 선반에 남았다." }
  - { panel: 16, beat: "Yunseo resumes sorting photographs on the usable chair", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "윤서는 다시 의자에 앉아, 멈춰 둔 사진 분류를 이어 갔다." }
  - { panel: 17, beat: "Doyun places a basket of dry covers beside the chair in Seoul", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "서울에 돌아온 도윤은 의자 곁에 마른 덮개 바구니를 함께 놓았다." }
  - { panel: 18, beat: "A visitor removes a damp cover", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "한 방문객은 젖은 덮개를 스스로 풀어 바구니에 넣었다." }
  - { panel: 19, beat: "Another visitor chooses and ties a dry cover", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "다른 방문객은 마른 덮개를 골라 뒤 끈을 직접 묶었다." }
  - { panel: 20, beat: "The chair remains in use while Doyun leaves the chosen cover alone", continuity_refs: [{ id: prop.wooden-chair.001, version: 1 }, { id: prop.replaceable-chair-cover.001, version: 1 }], caption: "나무를 숨기지 않아도, 갈아 둔 천 덕분에 의자는 계속 쓰였다." }
