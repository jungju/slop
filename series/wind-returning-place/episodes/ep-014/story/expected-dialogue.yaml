episode: ep-014
title: "바람이 돌아오는 곳 14: 열린 서랍"
lettering_mode: local_template3_narration_cards
factory_profile_exception: "The Wind series hard rule forbids generated Korean/fake text and requires local lettering."
expected_text:
  - { page: 1, text: "서울 전시장 서랍에서, 도윤은 이름 없는 작은 열쇠고리를 발견했다." }
  - { page: 2, text: "닳아진 금속에는, 오래 누군가의 손을 거친 둥근 자국만 남아 있었다." }
  - { page: 3, text: "순덕은 그 고리가 제주 집의 열린 서랍에 있던 것이라고 짧게 말했다." }
  - { page: 4, text: "바람 센 골목 끝에는, 바다 일을 돕는 작은 서랍장이 있었다." }
  - { page: 5, text: "서랍은 잠기지 않았다. 필요한 사람이 잠시 열어 두는 자리였다." }
  - { page: 6, text: "도윤은 장갑과 줄, 손전등이 든 칸을 오래 바라보았다." }
  - { page: 7, text: "순덕은 열쇠고리를 그의 손에 올렸다가, 곧 다시 서랍을 가리켰다." }
  - { page: 8, text: "도윤은 혹시 잃어버릴까 봐, 서랍을 닫으려 했다." }
  - { page: 9, text: "윤서는 손전등을 들고 물었다. ‘이건 누구 거예요?’" }
  - { page: 10, text: "비를 맞은 배달원은 말없이 손전등을 빌려 골목으로 나갔다." }
  - { page: 11, text: "빈 서랍은 사라진 것이 아니라, 다음 손을 기다리지 않고 남아 있었다." }
  - { page: 12, text: "도윤은 얼굴 대신, 쓰임을 기다리는 물건들의 자리를 사진에 담았다." }
  - { page: 13, text: "순덕은 열쇠고리도 한 사람의 주머니가 아니라 서랍 안에 두었다." }
  - { page: 14, text: "윤서는 젖은 모자를 걸어 두었다가, 스스로 마르면 다시 가져갔다." }
  - { page: 15, text: "돌아오는 배 위에서 도윤은 손을 펴고, 열쇠고리를 바람에 보였다." }
  - { page: 16, text: "서울에서 그는 낮은 보관 서랍 하나를 천천히 만들었다." }
  - { page: 17, text: "연필과 손전등과 빈 사진 봉투는, 누구의 이름도 붙지 않은 채 놓였다." }
  - { page: 18, text: "한 방문객은 물건을 잠시 빌렸고, 도윤은 멀리서 그 손을 기록했다." }
  - { page: 19, text: "문을 닫는 밤에도 도윤은 서랍을 끝까지 밀어 넣지 않았다." }
  - { page: 20, text: "열린 서랍은, 돌아올 사람을 세지 않아도 다음 손을 맞을 수 있었다." }
