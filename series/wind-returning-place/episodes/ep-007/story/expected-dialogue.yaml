episode_id: ep-007
expected_text:
  - id: p01-caption
    panel: 1
    kind: caption
    text: 서울 갤러리의 빈 벽 앞에서, 도윤은 빌린 자리가 얼마나 조용한지 들었다.
    required: true
  - id: p02-caption
    panel: 2
    kind: caption
    text: 계약서 위의 선들은 곧았지만, 마음은 자꾸 비어 있는 곳으로 기울었다.
    required: true
  - id: p03-caption
    panel: 3
    kind: caption
    text: 순덕은 벽을 빌리는 건, 남의 기억을 잠시 맡는 일이라고 했다.
    required: true
  - id: p04-caption
    panel: 4
    kind: caption
    text: 윤서는 낮은 벽을 올려다보며 물었다. "왜 벽을 빌려요?"
    required: true
  - id: p05-caption
    panel: 5
    kind: caption
    text: 도윤은 대답 대신, 천과 사진을 들고 바람 부는 길을 걸었다.
    required: true
  - id: p06-caption
    panel: 6
    kind: caption
    text: 마을 사람들은 사진보다 먼저, 손때 묻은 물건들을 조심히 내려놓았다.
    required: true
  - id: p07-caption
    panel: 7
    kind: caption
    text: 순덕은 도윤이 맞춘 줄을 살짝 밀고, 삐뚠 사진 하나를 먼저 걸었다.
    required: true
  - id: p08-caption
    panel: 8
    kind: caption
    text: 윤서는 자기 키에 맞는 곳에, 작은 사진을 낮게 붙였다.
    required: true
  - id: p09-caption
    panel: 9
    kind: caption
    text: 바람이 천벽을 흔들자, 도윤과 윤서는 말없이 양끝을 붙잡았다.
    required: true
  - id: p10-caption
    panel: 10
    kind: caption
    text: 오래된 손은 새 사진 옆에, 오래된 가장자리를 숨기지 않고 걸었다.
    required: true
  - id: p11-caption
    panel: 11
    kind: caption
    text: 도윤은 카메라를 내리고, 어디에 걸지 말하는 목소리를 들었다.
    required: true
  - id: p12-caption
    panel: 12
    kind: caption
    text: 벽은 점점 전시가 아니라, 잠시 머물 수 있는 마을의 자리처럼 보였다.
    required: true
  - id: p13-caption
    panel: 13
    kind: caption
    text: 서울로 돌아온 도윤은 고른 높이 대신, 그날의 흔들림을 옮겨 걸었다.
    required: true
  - id: p14-caption
    panel: 14
    kind: caption
    text: 관람객들은 긴 설명 없는 벽 앞에서, 자기 걸음의 속도를 늦췄다.
    required: true
  - id: p15-caption
    panel: 15
    kind: caption
    text: 한 사람은 낮은 사진을 보려고 허리를 숙였고, 시선도 함께 낮아졌다.
    required: true
  - id: p16-caption
    panel: 16
    kind: caption
    text: 윤서는 제주에서 가져온 작은 돌을, 가장 낮은 사진 아래에 두었다.
    required: true
  - id: p17-caption
    panel: 17
    kind: caption
    text: 도윤은 가운데 제목 카드를 떼고, 작은 빈 카드 하나만 남겨 두었다.
    required: true
  - id: p18-caption
    panel: 18
    kind: caption
    text: 사람들은 빈 카드 옆에, 말하지 않은 기억을 잠시 놓고 갔다.
    required: true
  - id: p19-caption
    panel: 19
    kind: caption
    text: 닫힌 갤러리에서 도윤은 카메라를 쉬게 두고 빌린 벽을 오래 바라보았다.
    required: true
  - id: p20-caption
    panel: 20
    kind: caption
    text: 빌린 벽은, 누군가의 기억이 잠시 기대어 다시 걸어가는 자리였다.
    required: true
review_rules:
  block_on_meaning_change: true
  block_on_fake_or_pseudo_text: true
  local_lettering_only: true
