episode_intent: "A small adjustable brass window stay lets Doyun learn that keeping a window open is a shared, revisable decision rather than a gesture he controls alone."
emotional_arc:
  start: "Doyun treats a worn window stay as a relic to keep safely in one fixed position."
  turn: "Soondeok and Yunseo show him that its ordinary notches let each person set the wind to the work at hand."
  end: "In Seoul, Doyun leaves the window stay reachable and accepts another person's adjustment without reclaiming it."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul discovery, active Jeju window repair and testing, quiet Seoul shared-use payoff"
character_agency:
  protagonist: "Doyun chooses to repair and leave the stay usable instead of fixing the window at his preferred opening."
  supporting_characters: "Soondeok insists on practical ventilation; Yunseo independently selects the middle notch that keeps her paper map still while allowing air in."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows a visitor setting the reachable brass stay while Doyun continues work, with fresh air and loose prints both safely moving in the shared Seoul room."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flatter painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
