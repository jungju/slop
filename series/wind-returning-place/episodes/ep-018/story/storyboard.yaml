  - { panel: 8, beat: "Yunseo independently chooses the middle notch", continuity_refs: [{ id: prop.window-stay.001, version: 1 }], caption: "그녀는 스스로 가운데 홈을 골라 지도를 눌렀다.", protected_zones: [Yunseo hand, brass stay, map] }
