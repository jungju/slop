  - { panel: 10, beat: "Soondeok moves one notch for today's wind", continuity_refs: [{ id: prop.window-stay.001, version: 1 }], caption: "순덕은 고정쇠를 한 칸 옮겼다. 오늘 바람에는 이만하면 돼." }
  - { panel: 11, beat: "Doyun lowers camera and watches movable window", continuity_refs: [{ id: prop.window-stay.001, version: 1 }], caption: "도윤은 창이 움직일 수 있다는 것을 보고 카메라를 내렸다." }
