pages:
  - { panel: 1, beat: "Doyun packs twenty wet prints in Seoul", caption: "서울 작업실에서, 도윤은 갓 씻은 사진 스무 장을 건조 상자에 넣었다." }
  - { panel: 2, beat: "Doyun calculates that the long Jeju line will fit all prints", caption: "그는 제주 마당의 긴 줄이면 모두 한꺼번에 말릴 수 있다고 계산했다." }
  - { panel: 3, beat: "Doyun densely fills the Jeju line with prints and blue pins", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "제주에 도착하자, 도윤은 파란 집게로 사진을 줄 끝까지 빽빽하게 걸었다." }
  - { panel: 4, beat: "Soondeok enters carrying wet work cloths", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "마지막 집게를 채운 순간, 순덕이 젖은 작업 수건을 들고 마당에 들어왔다." }
  - { panel: 5, beat: "Soondeok points to the needed section", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "순덕은 오늘 안에 말려야 한다며 줄의 한쪽을 가리켰다." }
  - { panel: 6, beat: "Doyun asks her to wait", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "도윤은 사진이 마를 때까지만 기다려 달라고 말했다." }
  - { panel: 7, beat: "Yunseo counts basket space and spare pins", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "윤서는 줄 아래 놓인 빈 바구니와 남은 집게 수를 세었다." }
  - { panel: 8, beat: "Yunseo notices air cannot pass between prints", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "그녀는 사진 사이 간격이 손가락 하나뿐이라 바람도 잘 통하지 않는다고 말했다." }
  - { panel: 9, beat: "Yunseo independently moves reachable pins", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "윤서는 자기 키에 닿는 집게부터 두 칸씩 옮기기 시작했다." }
  - { panel: 10, beat: "Soondeok waits while Doyun lowers his camera", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "순덕은 수건을 들고 기다렸고, 도윤은 카메라 대신 줄을 바라보았다." }
  - { panel: 11, beat: "Doyun removes four redundant prints", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "도윤은 가장 비슷한 사진 네 장을 골라 줄에서 내렸다." }
  - { panel: 12, beat: "Three people create an open right-hand section", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "세 사람은 사진 사이를 벌리고, 오른쪽에 빈 구간을 만들었다." }
  - { panel: 13, beat: "Soondeok hangs cloths in the open section", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "순덕은 빈 구간에 작업 수건을 걸었고, 사진과 수건 모두 바람을 받았다." }
  - { panel: 14, beat: "Yunseo marks the boundary with one blue pin", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "윤서는 파란 집게 하나를 경계에 끼워 빈 구간의 시작을 표시했다." }
  - { panel: 15, beat: "Doyun respects the marker", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "도윤은 그 표시를 옮기지 않고, 사진 순서만 다시 맞췄다." }
  - { panel: 16, beat: "Prints and cloths dry together at dusk", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "해가 기울 무렵 사진과 수건은 함께 말랐다." }
  - { panel: 17, beat: "Doyun hangs only half a Seoul line", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "서울로 돌아온 도윤은 작업실 건조줄에 사진을 절반만 걸었다." }
  - { panel: 18, beat: "He marks and leaves an empty span", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "그는 파란 집게 하나를 중간에 두고, 그 뒤를 비워 두었다." }
  - { panel: 19, beat: "Visitor uses the open span for a poster", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "찾아온 사람은 묻지 않고 그 빈 구간에 작은 포스터를 걸었다." }
  - { panel: 20, beat: "Doyun watches papers drying together without filling the last space", continuity_refs: [{ id: prop.blue-clothespin-line.001, version: 1 }], caption: "도윤은 남은 한 칸을 채우지 않은 채, 함께 마르는 종이를 바라보았다." }
