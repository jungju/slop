episode_intent: "A shared Jeju drying line teaches Doyun to leave practical capacity for another person's work instead of filling every available space with his own prints."
emotional_arc:
  start: "Doyun fills a communal line with his own wet photographs because he assumes unused space should be occupied."
  turn: "Soondeok needs room for work cloths and Yunseo independently rearranges blue pins to leave a clear section."
  end: "In Seoul, Doyun hangs fewer prints and deliberately leaves a reachable empty span for the next person."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul preparation, active Jeju line conflict and rearrangement, quiet Seoul shared-capacity payoff"
character_agency:
  protagonist: "Doyun removes and re-spaces his own prints rather than asking others to work around them."
  supporting_characters: "Soondeok states the practical conflict; Yunseo independently marks and creates the usable empty section."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows another visitor using the open span while Doyun continues working without reclaiming it."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flat painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
