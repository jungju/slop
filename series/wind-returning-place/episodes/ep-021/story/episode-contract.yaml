episode_intent: "A folded raincoat hook in the Jeju repair shed teaches Doyun to leave shared tools ready for the next person's actual use instead of preserving them as tidy fixtures."
emotional_arc:
  start: "Doyun keeps the old folding hook flat against the wall because the narrow passage looks cleaner that way."
  turn: "Yunseo independently unfolds it to dry her raincoat while Soondeok points out that wet coats have been piled on chairs for years."
  end: "Doyun installs the same usable hook in Seoul and leaves it open for a visitor without assigning who may use it."
scene_density: "one concrete event, action, reason, and visible change on every page"
panel_rhythm: "compressed Seoul observation, wet Jeju repair and testing, quiet Seoul return payoff"
character_agency:
  protagonist: "Doyun listens, measures, repairs, and copies Yunseo's practical choice without calling it his solution."
  supporting_characters: "Yunseo unfolds and tests the hook herself; Soondeok supplies the wet-coat friction and tests the load."
narration_level: low_to_medium
metaphor_level: "one grounded final-page image only"
payoff_rule: "The final page visibly shows a visitor hanging a wet coat without asking Doyun."
visual_lock: "Restrained Korean webtoon illustration with soft ink contours, flat painterly color blocks and light cel shading; never live action or generated text, logos, watermarks, speech bubbles, or captions. Korean text is added locally only."
